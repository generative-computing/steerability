
preserve_directory_names: true

flatten_single_child_sections: true

ignore:
  - "*.hidden.md"
  - "*.py"

sort:
  direction: asc
  type: natural
  by: filename
  sections: last
  ignore_case: true

nav:
  - Home:
      - Welcome: index.md
      - Installation: home/installation.md
      - Quickstart: home/quickstart.md
  - Concepts:
    - Concepts: concepts/index.md
    - Controls: concepts/controls.md
    - Probes: concepts/probes.md
    - Steering pipelines: concepts/steering_pipelines.md
#    - Use cases & benchmarking: concepts/benchmarks.md
  - Tutorials:
    - Tutorials: tutorials/index.md
    - Add a steering method: "tutorials/add_new_steering_method.md"
    - Add a metric: "tutorials/add_new_metric.md"
    - Add a use case: "tutorials/add_new_use_case.md"
    - Add a benchmark: "tutorials/add_new_benchmark.md"
    - Add a new input control: "tutorials/add_method_by_category/add_new_input_control.md"
    - Add a new output control: "tutorials/add_method_by_category/add_new_output_control.md"
    - Add a new state control: "tutorials/add_method_by_category/add_new_state_control.md"
