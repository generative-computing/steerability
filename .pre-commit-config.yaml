default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/ibm/detect-secrets
    # prefer a static ref (tag or commit sha) over a branch name; `pre-commit autoupdate`
    # moves this to the latest tag
    rev: 0.13.1+ibm.64.dss
    hooks:
      - id: detect-secrets  # pragma: whitelist secret
        # --use-all-plugins scans with every available plugin rather than only those
        # recorded in the baseline
        args: [--baseline, .secrets.baseline, --use-all-plugins]
        additional_dependencies: [boxsdk<4]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        # the study notebooks retain their outputs and run to roughly 600KB
        args: [--maxkb=1024]
      - id: check-yaml
        # --unsafe checks syntax only; mkdocs.yml uses Python-specific YAML tags that the
        # parser cannot construct
        args: [--unsafe]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements

  - repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
      - id: isort
        name: isort (python)
        # settings come from [tool.isort] in pyproject.toml
        args: [--filter-files]
